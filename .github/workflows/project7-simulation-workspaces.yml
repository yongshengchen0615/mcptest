name: Project 7 Simulation Workspaces
on:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: project7-simulation-workspaces
  cancel-in-progress: false

jobs:
  bootstrap:
    if: >-
      github.event.issue.user.login == 'yongshengchen0615' &&
      github.event.sender.login == 'yongshengchen0615' &&
      contains(github.event.issue.body, '<!-- project7-simulation-bootstrap:v1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check script syntax
        run: node --check .github/scripts/project7-simulation-bootstrap.mjs
      - name: Create simulation views and update progress
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          REPO_TOKEN: ${{ github.token }}
        run: node .github/scripts/project7-simulation-bootstrap.mjs
