name: Project 7 Chat Commands
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: project7-chat-command-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  command:
    if: >-
      github.event.issue.user.login == 'yongshengchen0615' &&
      github.event.sender.login == 'yongshengchen0615' &&
      contains(github.event.issue.body, '<!-- project7-control:v1 -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests
        run: |
          node --test .github/scripts/project7-core.test.mjs
          node --test .github/scripts/project7-control.test.mjs
      - name: Execute Project #7 command
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          GH_PROMPT_DISABLED: '1'
          PROJECT7_ENABLE_SCHEMA: ${{ vars.PROJECT7_ENABLE_SCHEMA }}
          PROJECT7_ENABLE_ARCHIVE: ${{ vars.PROJECT7_ENABLE_ARCHIVE }}
          PROJECT7_ENABLE_SETTINGS: ${{ vars.PROJECT7_ENABLE_SETTINGS }}
        run: node .github/scripts/project7-control.mjs
