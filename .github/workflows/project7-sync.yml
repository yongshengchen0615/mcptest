name: Sync GitHub Project 7
on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

# Prevent a burst of labeled issues from launching parallel GraphQL writes.
concurrency:
  group: project7-sync-serial
  cancel-in-progress: false

jobs:
  project7:
    if: >-
      github.event.issue.user.login == 'yongshengchen0615' &&
      github.event.sender.login == 'yongshengchen0615' &&
      contains(github.event.issue.body, '<!-- project7-managed -->')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate sync logic
        run: node --test .github/scripts/project7-core.test.mjs
      - name: Synchronize card
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_V2_TOKEN }}
          GH_PROMPT_DISABLED: '1'
        run: node .github/scripts/sync-project7.mjs
