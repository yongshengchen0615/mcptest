name: Test Project 7 Control Center
on:
  pull_request:
    paths:
      - '.github/scripts/project7-*.mjs'
      - '.github/workflows/project7-command*.yml'
      - 'docs/PROJECT7_CHAT_CONTROL.md'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/project7-core.test.mjs .github/scripts/project7-control.test.mjs
